name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      # lz4(1) is the oracle for the standard frame (frame_cli_test.go): both
      # directions run here, and LZ4_CLI_REQUIRED turns "not installed" from a
      # skip into a failure so a green run cannot mean "never asked lz4".
      - run: sudo apt-get install -y lz4
      - run: go vet ./...
      - run: LZ4_CLI_REQUIRED=1 go test -race -v ./...
      # The frame bomb tests under a hard Go heap cap, far below what the
      # forged frames claim.
      - run: GOMEMLIMIT=64MiB LZ4_CLI_REQUIRED=1 go test -count=1 -run 'FrameBomb' -v .
      - name: coverage gate (100%)
        env: { LZ4_CLI_REQUIRED: '1' }
        run: |
          go test -covermode=atomic -coverprofile=cov.out ./...
          pct=$(go tool cover -func=cov.out | awk '/^total:/{print $3}')
          echo "coverage=$pct"
          [ "$pct" = "100.0%" ] || { echo "coverage below 100%"; exit 1; }
  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
  # Apple's own encoder is the only witness for apple.go that did not come from
  # the same author as the decoder, and it exists on exactly one runner. Without
  # this job the oracle tests skip everywhere and a suite of skips is green --
  # which would make them indistinguishable from not having written them.
  darwin:
    name: Apple's own encoder (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - name: test against libcompression
        run: CGO_ENABLED=1 go test -count=1 -v ./... 2>&1 | tee out.txt
      - name: the oracle tests must have RUN, not skipped
        run: |
          for t in TestDecompressAppleReadsWhatAppleWrote \
                   TestAHighlyCompressibleStreamCrossesBlocks \
                   TestTheOracleIsNotAgreeingWithAnything; do
            grep -q -- "--- PASS: $t" out.txt || {
              echo "::error::$t did not run on the one runner that can ask Apple"; exit 1; }
          done
          echo "all three oracle tests ran"

  emulated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: riscv64, image: "debian:trixie", qemu: "rv64,v=true,vlen=128" }
          - { arch: loong64, image: "ghcr.io/loong64/debian:trixie", qemu: "la464" }
          - { arch: ppc64le, image: "debian:trixie", qemu: "power9" }
          - { arch: s390x,   image: "debian:trixie", qemu: "qemu" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: docker run --privileged --rm tonistiigi/binfmt --install all
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go test -c -o /tmp/t.test .
      - run: docker run --rm --platform linux/${{ matrix.arch }} -e QEMU_CPU=${{ matrix.qemu }} -v /tmp:/t ${{ matrix.image }} /t/t.test -test.v
